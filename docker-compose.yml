version: '3.8'

services:
  # 1. MICROSOFT SQL SERVER 2022
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pig-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - pig-network

  # 2. SPRING BOOT BACKEND
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pig-backend
    environment:
      - DB_SERVER=sqlserver
      - DB_PORT=1433
      - DB_NAME=Pig
      - DB_USER=sa
      - DB_PASSWORD=YourPassword123!
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    networks:
      - pig-network

  # 3. REACT FRONTEND
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pig-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - pig-network

volumes:
  mssql_data:

networks:
  pig-network:
    driver: bridge
