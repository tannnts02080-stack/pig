# ===================================================================
# SPRING BOOT APPLICATION CONFIGURATION - DỰ ÁN QUẢN LÝ BUÔN BÁN HEO
# ===================================================================
server.port=8080

# CẤU HÌNH KẾT NỐI DATABASE MICROSOFT SQL SERVER 'Pig'
spring.datasource.url=jdbc:sqlserver://${DB_SERVER:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:Pig};encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# CẤU HÌNH HIBERNATE JPA TỰ ĐỘNG TẠO / CẬP NHẬT DATABASE & BẢNG (AUTO-DDL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# PREFIX REST API V1
server.servlet.context-path=/
