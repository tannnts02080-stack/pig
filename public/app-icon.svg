<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="ice" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
  <g fill="url(#ice)">
    <!-- Snowflake center -->
    <circle cx="256" cy="256" r="32"/>
    <!-- Snowflake 6 branches -->
    <!-- Vertical -->
    <rect x="244" y="96" width="24" height="320" rx="12"/>
    <!-- Branch 1 (60 deg) -->
    <rect x="244" y="96" width="24" height="320" rx="12" transform="rotate(60 256 256)"/>
    <!-- Branch 2 (120 deg) -->
    <rect x="244" y="96" width="24" height="320" rx="12" transform="rotate(120 256 256)"/>
    
    <!-- Chevrons -->
    <path d="M220 140 L256 104 L292 140" fill="none" stroke="url(#ice)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M220 372 L256 408 L292 372" fill="none" stroke="url(#ice)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="256" y="460" font-family="Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="4">KHO ĐÔNG LẠNH</text>
</svg>
